name: Android CI & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Android Build & Test (Phone + TV)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint checks
        run: ./gradlew :shared:ktlintCheck :androidApp:ktlintCheck --no-daemon

      - name: Run Android unit tests
        run: ./gradlew :shared:testAndroidHostTest :androidApp:testDebugUnitTest --no-daemon

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/deltax-music-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/deltax-music-release.jks" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing; release APK would be unsigned."
            exit 1
          fi

      - name: Assemble Android Debug & Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease --no-daemon

      - name: Verify release APK signature
        if: env.KEYSTORE_PATH != ''
        run: |
          shopt -s nullglob
          unsigned=(androidApp/build/outputs/apk/release/*-unsigned.apk)
          if [ ${#unsigned[@]} -gt 0 ]; then
            echo "ERROR: Found unsigned release APK: ${unsigned[*]}"
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          for apk in androidApp/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: deltax-music-apks
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
